# Alembic configuration for Vidyalaya AI.
# Run from the repository root:
#   alembic upgrade head
#   alembic revision --autogenerate -m "add something"
# The database URL is read from DATABASE_URL (see .env), not from this file.

[alembic]
script_location = database/migrations
prepend_sys_path = backend
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
